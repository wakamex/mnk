[package]
name = "mnk_game"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mnk_game"
path = "play.rs"

[[bin]]
name = "train_alphazero"
path = "src/train_alphazero.rs"

[[bin]]
name = "train_alphazero_gpu"
path = "src/train_alphazero_gpu.rs"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.7"
indicatif = "0.17"
bincode = "1.3"
num_cpus = "1.16"
ndarray = { version = "0.15", features = ["serde-1"] }

# Burn - Deep learning framework
burn = { version = "0.17.1", features = ["ndarray", "autodiff"] }
burn-ndarray = { version = "0.17.1" }
burn-candle = { version = "0.17.1", optional = true }

# Candle - Rust native deep learning (consistent with burn-candle)
candle-core = { version = "0.8.4", features = ["cuda"] }
candle-nn = { version = "0.8.4", features = ["cuda"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "burn-candle/cuda"]
metal = ["candle-core/metal"]