[package]
name = "mnk_game"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mnk_game"
path = "play.rs"

[[bin]]
name = "train_alphazero"
path = "src/train_alphazero_unified.rs"

[lib]
name = "mnk"
path = "src/lib.rs"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.7"
indicatif = "0.17"
bincode = "1.3"
num_cpus = "1.16"
clap = { version = "4.0", features = ["derive"] }
ndarray = { version = "0.15", features = ["serde-1"] }

# Burn - Deep learning framework
burn = { version = "0.17.1", features = ["ndarray", "autodiff"] }
burn-ndarray = { version = "0.17.1" }
burn-cuda = { version = "0.17.1", optional = true }

[features]
default = []
cuda = ["burn-cuda"]
