[package]
name = "mnk_game"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mnk_game"
path = "play.rs"

[[bin]]
name = "train_alphazero"
path = "src/train_alphazero_unified.rs"

[[bin]]
name = "run_diagnostics"
path = "src/run_diagnostics.rs"

[[bin]]
name = "test_minibt4"
path = "test_minibt4.rs"

[[bin]]
name = "test_minimal_inference"
path = "test_minimal_inference.rs"

[[bin]]
name = "test_ultra_minimal"
path = "test_ultra_minimal.rs"

[[bin]]
name = "test_training_style_inference"
path = "test_training_style_inference.rs"


[lib]
name = "mnk"
path = "src/lib.rs"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.7"
indicatif = "0.17"
bincode = "1.3"
num_cpus = "1.16"
clap = { version = "4.0", features = ["derive"] }
ndarray = { version = "0.15", features = ["serde-1"] }

# Burn - Deep learning framework
burn = { version = "0.17.1", features = ["ndarray", "autodiff"] }
burn-ndarray = { version = "0.17.1" }
burn-candle = { version = "0.17.1", optional = true }

# Candle - Rust native deep learning (latest version with cudarc 0.19.x)
# Temporarily disabled CUDA features due to GCC version incompatibility
candle-core = { version = "0.9.2" }
candle-nn = { version = "0.9.2" }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "burn-candle/cuda"]
metal = ["candle-core/metal"]